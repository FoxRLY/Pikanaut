[tox]
env_list = py310, py311, py312, py313, py314, py315
skip_missing_interpreters = false

[testenv]
description = Установка wheel, тесты, типизация и примеры
package = wheel
dependency_groups = dev
uv_python_preference = managed
pass_env =
    DOCKER_HOST
    DOCKER_TLS_VERIFY
    DOCKER_CERT_PATH
    TESTCONTAINERS_*
    XDG_RUNTIME_DIR
commands =
    python -c "import sys, pikanaut; print(sys.version); print('Installed package:', pikanaut.__file__)"
    python -m pytest -ra {posargs}
    python -m mypy
    python -m pyright
    python -c "from pathlib import Path; import subprocess, sys; scripts = sorted(Path('examples').glob('[0-9]*.py')); assert scripts, 'No examples found'; [subprocess.run([sys.executable, str(script)], check=True) for script in scripts]"
